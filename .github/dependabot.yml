version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Cap open Dependabot PRs to limit Actions minutes from ambient dep noise.
    open-pull-requests-limit: 5
    target-branch: staging
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
